<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIW Festival - Dettaglio Regista</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content" th:if="${regista}">
        <div class="detail-card">
            <div class="detail-header">
                <div class="detail-icon"></div>
                <h1 th:text="${regista.nome + ' ' + regista.cognome}">Nome Regista</h1>
                <span class="detail-badge" th:text="${regista.nazionalita}">Nazionalita'</span>
            </div>

            <div class="detail-body">
                <div class="detail-field">
                    <span class="detail-label">Data di Nascita</span>
                    <p th:text="${#temporals.format(regista.dataNascita, 'dd/MM/yyyy')}">01/01/1970</p>
                </div>

                <div class="detail-field">
                    <span class="detail-label">Filmografia</span>
                    <div th:if="${regista.film != null and !regista.film.isEmpty()}">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Titolo</th>
                                    <th>Anno</th>
                                    <th>Genere</th>
                                    <th>Durata</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="f : ${regista.film}">
                                    <td th:text="${f.titolo}">Titolo</td>
                                    <td th:text="${f.anno}">2020</td>
                                    <td th:text="${f.genere != null ? f.genere.label : '-'}">Genere</td>
                                    <td th:text="${f.durata} + ' min'">120 min</td>
                                    <td><a th:href="@{'/film/' + ${f.id}}" class="btn-small">Dettagli</a></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <p th:if="${regista.film == null or regista.film.isEmpty()}" class="empty-text">
                        Nessun film registrato per questo regista.
                    </p>
                </div>
            </div>

            <div class="detail-actions">
                <a th:href="@{/registi}" class="btn btn-secondary">&larr; Torna ai Registi</a>
                <a sec:authorize="hasRole('ADMIN')"
                   th:href="@{'/admin/regista/' + ${regista.id} + '/edit'}" class="btn btn-secondary">Modifica</a>
                <form sec:authorize="hasRole('ADMIN')"
                      th:action="@{'/admin/regista/' + ${regista.id} + '/delete'}" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Eliminare questo regista?')">Elimina Regista</button>
                </form>
            </div>
        </div>
    </section>
</body>
</html>
