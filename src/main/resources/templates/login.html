<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIW Festival - Login</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="form-container">
            <h2>Accesso al Sistema</h2>

            <div th:if="${param.error}">
                <p class="error-msg">Username o password non validi. Riprova.</p>
            </div>
            <div th:if="${param.logout}">
                <p class="success-msg">Sei uscito con successo.</p>
            </div>
            <div th:if="${param.registered}">
                <p class="success-msg">Registrazione completata! Ora puoi accedere.</p>
            </div>

            <form th:action="@{/login}" method="POST">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Il tuo username" required autofocus />

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="La tua password" required />

                <button type="submit">Accedi</button>
            </form>

            <div class="form-link">
                Non hai un account? <a th:href="@{/register}">Registrati qui</a>
            </div>
        </div>
    </section>
</body>
</html>
