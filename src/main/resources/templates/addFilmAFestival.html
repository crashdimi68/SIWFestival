<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIW Festival - Aggiungi Film al Festival</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="form-container">
            <h2>Aggiungi Film al Festival</h2>
            <p style="text-align:center; margin-bottom:1.5rem;">
                Festival: <strong th:text="${festival.nome}">Nome Festival</strong>
            </p>

            <div th:if="${filmDisponibili.isEmpty()}" class="empty-state">
                <p>Nessun film disponibile da aggiungere.</p>
            </div>

            <form th:unless="${filmDisponibili.isEmpty()}"
                th:action="@{'/admin/festival/' + ${festival.id} + '/addFilm'}" method="POST">

                <label for="filmId">Film</label>
                <select name="filmId" id="filmId" required>
                    <option value="">-- Seleziona Film --</option>
                    <option th:each="f : ${filmDisponibili}" th:value="${f.id}"
                        th:text="${f.titolo + ' (' + f.anno + ')'}">Film</option>
                </select>

                <button type="submit">Aggiungi</button>
            </form>

            <div class="form-link">
                <a th:href="@{/admin/film/new(festivalId=${festival.id})}">+ Crea un nuovo film</a>
            </div>

            <div class="form-link">
                <a th:href="@{'/festival/' + ${festival.id}}">&larr; Torna al festival</a>
            </div>
        </div>
    </section>
</body>

</html>
