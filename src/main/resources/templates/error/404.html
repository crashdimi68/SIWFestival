<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIW Festival - Pagina non trovata</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="empty-state">
            <div class="empty-icon"></div>
            <h1>404 &mdash; Pagina non trovata</h1>
            <p th:text="${errorMessage}">La pagina richiesta non esiste.</p>
            <div class="detail-actions">
                <a th:href="@{/}" class="btn btn-primary">&larr; Torna alla Home</a>
                <a th:href="@{/festival}" class="btn btn-secondary">Vedi i Festival</a>
            </div>
        </div>
    </section>
</body>
</html>
