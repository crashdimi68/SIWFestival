<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIW Festival - Registrazione</title>
    <link rel="stylesheet" th:href="@{/css/stile.css}" />
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <section class="page-content">
        <div class="form-container">
            <h2>Registrazione</h2>

            <form th:action="@{/register}" th:object="${credentials}" method="POST">
                <div class="form-section-title">Dati Anagrafici</div>

                <label for="name">Nome</label>
                <input type="text" id="name" th:field="*{user.name}" placeholder="Il tuo nome" required />
                <p class="error-msg" th:if="${#fields.hasErrors('user.name')}" th:errors="*{user.name}">errore nome</p>

                <label for="surname">Cognome</label>
                <input type="text" id="surname" th:field="*{user.surname}" placeholder="Il tuo cognome" required />
                <p class="error-msg" th:if="${#fields.hasErrors('user.surname')}" th:errors="*{user.surname}">errore cognome</p>

                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{user.email}" placeholder="La tua email" required />
                <p class="error-msg" th:if="${#fields.hasErrors('user.email')}" th:errors="*{user.email}">errore email</p>

                <div class="form-section-title">Credenziali di Accesso</div>

                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" placeholder="Scegli un username" required />
                <p class="error-msg" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">errore username</p>

                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Scegli una password" required />
                <p class="error-msg" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">errore password</p>

                <button type="submit">Registrati</button>
            </form>

            <div class="form-link">
                Hai gia' un account? <a th:href="@{/login}">Accedi qui</a>
            </div>
        </div>
    </section>
</body>
</html>
