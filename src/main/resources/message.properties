# Messaggi di validazione (Bean Validation via Spring MessageSource).
#
# NOTA IMPORTANTE: Spring MessageSource usa java.text.MessageFormat, che accetta
# SOLO placeholder numerici {0}, {1}, {2}. NON supporta {min}, {max} (che sono
# invece placeholder di Bean Validation puro). Per semplicita', qui hardcodiamo
# i numeri nei messaggi custom — sono valori stabili nelle annotation.

# --- Messaggi generici (applicati a tutti i campi) ---
NotBlank=Campo obbligatorio
NotNull=Campo obbligatorio
Email=Formato email non valido
Past=La data deve essere nel passato
Pattern=Formato non valido
typeMismatch=Formato non valido

# --- Messaggi specifici per campi Credentials ---
Size.credentials.username=Lo username deve essere compreso tra 3 e 30 caratteri
NotBlank.credentials.username=Lo username e' obbligatorio
NotBlank.credentials.password=La password e' obbligatoria
Size.credentials.password=La password deve avere almeno 3 caratteri

# --- Messaggi specifici per campi User ---
NotBlank.user.name=Il nome e' obbligatorio
NotBlank.user.surname=Il cognome e' obbligatorio
NotBlank.user.email=L'email e' obbligatoria
Email.user.email=Formato email non valido
